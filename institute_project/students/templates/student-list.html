{% extends 'master/base.html' %}

{% block title %}
    Student List
{% endblock title %}
    

{% block body %}
    <h1>Student List</h1>
    <a href="{% url 'add_student' %}" class="btn btn-success">Add Student</a>
    <form method="GET" class="mt-4">
        <div class="row g-3 align-items-center">
            <div class="col-auto">
                <input type="text" name="query" id="inputPassword6" class="form-control" aria-describedby="passwordHelpInline">
            </div>
            <div class="col-auto">
               <button type="submit" class="btn btn-primary">Search</button>
            </div>
        </div>
    </form>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>SL</th>
                <th>Name</th>
                <th>Roll</th>
                <th>Image</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            
            {% for data in student_list %}
            <tr>
                <td>{{forloop.counter}}</td>
                <td>{{data.name}}</td>
                <td>{{data.roll_no}}</td>
                <td>
                    <img src="{{ data.image.url }}" width="50px" alt="">
                </td>
                <td>
                    <a href="">Edit</a>
                    <a href="">Delete</a>
                </td>
            </tr>
                
            {% endfor %}
                
        </tbody>

    </table>
{% endblock body %}
