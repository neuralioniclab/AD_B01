{% extends 'master/base.html' %}
{% block title %}Delete {{object}}{% endblock title %}
{% block body %}
<h1>Delete {{object}}?</h1>
<p>Related records may also be removed.</p>
<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url cancel_url %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock body %}
